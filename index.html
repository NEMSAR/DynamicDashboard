<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Analytics - Dashboard Dinámico</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@1.8.5/umd/Recharts.min.js"></script>

  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-sidebar: #05070a;
      --bg-widget: rgba(20, 26, 40, 0.6);
      --border-light: rgba(255, 255, 255, 0.05);
      --border-highlight: rgba(255, 255, 255, 0.15);
      
      --text-main: #f8fafc;
      --text-muted: #8b95a5;
      
      --neon-blue: #3b82f6;
      --neon-cyan: #06b6d4;
      --neon-purple: #8b5cf6;
      --neon-orange: #f97316;
      
      --alert-red: #ef4444;
      --alert-green: #10b981;
      
      --glow-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }

    body {
      margin: 0; padding: 0; font-family: 'Inter', sans-serif;
      background-color: var(--bg-base); color: var(--text-main); overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 90% 60%, rgba(249, 115, 22, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 10% 40%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseNeon { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; opacity: 0; }
    
    .widget {
      background: var(--bg-widget); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light); border-radius: 20px; padding: 1.5rem; transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .widget:hover { border-color: var(--border-highlight); transform: translateY(-2px); box-shadow: var(--glow-shadow); }

    .app-container { display: flex; min-height: 100vh; }

    .sidebar {
      width: 80px; background: var(--bg-sidebar); border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column; align-items: center; padding: 2rem 0; position: sticky; top: 0; height: 100vh; z-index: 50;
    }
    .nav-icon {
      width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 24px; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s;
    }
    .nav-icon.active, .nav-icon:hover {
      background: rgba(59, 130, 246, 0.15); color: var(--neon-blue); box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    .main-content { flex: 1; padding: 2rem 3rem; max-width: 1600px; margin: 0 auto; width: calc(100% - 80px); box-sizing: border-box; }

    .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
    .bento-col-2 { grid-column: span 2; }
    @media (max-width: 1024px) { .bento-col-2 { grid-column: span 1; } }

    .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; }
    .file-upload-btn {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); border: none; color: white;
      padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all 0.3s; animation: pulseNeon 2s infinite;
    }
    .file-upload-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }

    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { text-align: left; padding: 1rem; color: var(--text-muted); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--border-light); }
    td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 14px; color: #fff; }
    tr:hover { background: rgba(255,255,255,0.05); }

    .input-premium {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light);
      border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; transition: all 0.3s;
    }
    .input-premium:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    
    select.input-premium option { background: var(--bg-sidebar); color: white; }
  </style>
</head>
<body>
  <div id="root">
    <div style="color: white; padding: 2rem; text-align: center; font-family: sans-serif;">Inicializando NEMS Analytics...</div>
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;
    const CHART_COLORS = ['#3b82f6', '#06b6d4', '#8b5cf6', '#f97316', '#10b981', '#f43f5e'];

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'reports', 'settings'
      
      const [data, setData] = useState([]);
      const [columns, setColumns] = useState([]);
      
      // Configuraciones manuales del usuario
      const [userConfig, setUserConfig] = useState({
        xAxis: '', yAxis1: '', yAxis2: ''
      });

      const [time, setTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const buffer = new Uint8Array(event.target.result);
            const workbook = XLSX.read(buffer, { type: 'array' });
            const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            if (sheetData.length > 0) {
              const cols = Object.keys(sheetData[0]);
              setData(sheetData);
              setColumns(cols);
              // Resetear config al cargar nuevo archivo
              setUserConfig({ xAxis: '', yAxis1: '', yAxis2: '' });
              setActiveTab('dashboard');
            }
          } catch (err) { alert("Error: " + err.message); }
        };
        reader.readAsArrayBuffer(file);
      };

      // MOTOR DE ANÁLISIS DINÁMICO
      const { catCols, numCols, activeX, activeY1, activeY2, kpis } = useMemo(() => {
        if (!data.length || !columns.length) return { catCols:[], numCols:[], activeX:null, activeY1:null, activeY2:null, kpis:null };
        
        // 1. Separar tipos de datos
        const textCols = columns.filter(col => typeof data[0][col] === 'string' || isNaN(Number(data[0][col])));
        const numericCols = columns.filter(col => typeof data[0][col] === 'number' || !isNaN(Number(data[0][col])));

        // 2. Determinar columnas activas (Usa la config del usuario, si no, autodetecta)
        const aX = userConfig.xAxis || (textCols.length > 0 ? textCols[0] : columns[0]);
        const aY1 = userConfig.yAxis1 || (numericCols.length > 0 ? numericCols[0] : columns[1] || columns[0]);
        const aY2 = userConfig.yAxis2 || (numericCols.length > 1 ? numericCols[1] : '');

        // 3. Procesar datos para garantizar números
        const processed = data.map(row => ({
          ...row,
          [aY1]: Number(row[aY1]) || 0,
          ...(aY2 ? { [aY2]: Number(row[aY2]) || 0 } : {})
        }));

        // 4. Calcular KPIs dinámicos basados en la métrica principal (aY1)
        let totalSum = 0;
        let maxVal = -Infinity;
        
        processed.forEach(row => {
          const val = row[aY1];
          totalSum += val;
          if (val > maxVal) maxVal = val;
        });

        const avgVal = processed.length > 0 ? (totalSum / processed.length) : 0;

        return { 
          catCols: textCols, 
          numCols: numericCols, 
          activeX: aX, 
          activeY1: aY1, 
          activeY2: aY2,
          kpis: { 
            count: processed.length, 
            sum: totalSum, 
            avg: avgVal.toFixed(2), 
            max: maxVal === -Infinity ? 0 : maxVal,
            data: processed
          } 
        };
      }, [data, columns, userConfig]);

      if (!isLoggedIn) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div className="widget fade-in-up" style={{ width: '100%', maxWidth: '400px' }}>
              <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
                <div style={{ width: '60px', height: '60px', background: 'linear-gradient(135deg, var(--neon-blue), var(--neon-cyan))', borderRadius: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1rem auto', fontSize: '24px', color: 'white', fontWeight: 'bold' }}>N.</div>
                <h2 style={{ margin: '0 0 0.5rem 0' }}>NEMS Analytics</h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', margin: 0 }}>Portal de Inteligencia de Datos</p>
              </div>
              <form onSubmit={(e) => { e.preventDefault(); setIsLoggedIn(true); }}>
                <input type="text" className="input-premium" placeholder="Usuario" defaultValue="emanuel" style={{ marginBottom: '1rem' }} />
                <input type="password" className="input-premium" placeholder="Contraseña" defaultValue="arcor2026" style={{ marginBottom: '1.5rem' }} />
                <button type="submit" className="file-upload-btn" style={{ width: '100%', justifyContent: 'center', animation: 'none' }}>Acceder al Tablero</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          
          {/* BARRA LATERAL NAVEGABLE */}
          <div className="sidebar fade-in-up">
            <div style={{ color: 'white', fontSize: '24px', fontWeight: 'bold', marginBottom: '3rem' }}>N.</div>
            
            <div className={`nav-icon ${activeTab === 'dashboard' ? 'active' : ''}`} title="Dashboard Interactivo" onClick={() => setActiveTab('dashboard')}>
              <i className="ph ph-squares-four"></i>
            </div>
            <div className={`nav-icon ${activeTab === 'reports' ? 'active' : ''}`} title="Tabla de Datos" onClick={() => setActiveTab('reports')}>
              <i className="ph ph-chart-line-up"></i>
            </div>
            <div className={`nav-icon ${activeTab === 'settings' ? 'active' : ''}`} title="Configuración de Variables" onClick={() => setActiveTab('settings')}>
              <i className="ph ph-gear"></i>
            </div>
            
            <div style={{ marginTop: 'auto' }}>
              <div className="nav-icon" title="Cerrar Sesión" onClick={() => setIsLoggedIn(false)}>
                <i className="ph ph-sign-out"></i>
              </div>
            </div>
          </div>

          <div className="main-content">
            {/* HEADER UNIVERSAL */}
            <div className="widget bento-grid fade-in-up" style={{ padding: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'linear-gradient(135deg, rgba(20,26,40,0.9), rgba(59,130,246,0.15))', marginBottom: '2rem' }}>
              <div>
                <p style={{ color: 'var(--neon-cyan)', margin: '0 0 5px 0', fontSize: '13px', fontWeight: '600', textTransform: 'uppercase', letterSpacing: '1px' }}>Workspace Dinámico</p>
                <h1 style={{ margin: 0, fontSize: '28px', fontWeight: '600' }}>Análisis de Datos Global</h1>
                <p style={{ color: 'var(--text-muted)', margin: '8px 0 0 0', fontSize: '14px' }}>Carga cualquier reporte y el motor adaptará las métricas.</p>
              </div>
              <div className="file-upload-wrapper">
                <button className="file-upload-btn"><i className="ph ph-upload-simple" style={{ fontSize: '20px' }}></i><span>Importar Origen de Datos (.xlsx)</span></button>
                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} />
              </div>
            </div>

            {/* VISTA 1: DASHBOARD */}
            {activeTab === 'dashboard' && data.length > 0 && activeY1 && (
              <div className="fade-in-up">
                {/* KPIs Dinámicos */}
                <div className="bento-grid">
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 10px 0', fontSize: '13px', textTransform: 'uppercase' }}>Total Registros</p>
                    <h3 style={{ margin: 0, fontSize: '32px' }}>{kpis.count}</h3>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 10px 0', fontSize: '13px', textTransform: 'uppercase', overflow: 'hidden', textOverflow: 'ellipsis' }}>Suma de {activeY1}</p>
                    <h3 style={{ margin: 0, fontSize: '32px', color: 'var(--neon-blue)' }}>{kpis.sum.toLocaleString()}</h3>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 10px 0', fontSize: '13px', textTransform: 'uppercase', overflow: 'hidden', textOverflow: 'ellipsis' }}>Promedio de {activeY1}</p>
                    <h3 style={{ margin: 0, fontSize: '32px', color: 'var(--neon-cyan)' }}>{kpis.avg}</h3>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 10px 0', fontSize: '13px', textTransform: 'uppercase', overflow: 'hidden', textOverflow: 'ellipsis' }}>Valor Máx. {activeY1}</p>
                    <h3 style={{ margin: 0, fontSize: '32px', color: 'var(--neon-purple)' }}>{kpis.max.toLocaleString()}</h3>
                  </div>
                </div>

                {/* Gráficos Dinámicos */}
                <div className="bento-grid">
                  <div className="widget bento-col-2">
                    <h3 style={{ margin: '0 0 1.5rem 0', fontSize: '16px', fontWeight: '500' }}>Proyección: {activeY1} {activeY2 ? `vs ${activeY2}` : ''} según {activeX}</h3>
                    <ResponsiveContainer width="100%" height={350}>
                      <BarChart data={kpis.data.slice(0, 50)} margin={{ top: 10, right: 10, left: 0, bottom: 20 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="rgba(255,255,255,0.05)" />
                        <XAxis dataKey={activeX} tick={{fill: '#8b95a5', fontSize: 11}} axisLine={false} tickLine={false} />
                        <YAxis tick={{fill: '#8b95a5', fontSize: 11}} axisLine={false} tickLine={false} />
                        <Tooltip cursor={{fill: 'rgba(255,255,255,0.02)'}} contentStyle={{ backgroundColor: 'rgba(10,13,20,0.95)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '12px' }} />
                        <Legend />
                        <Bar dataKey={activeY1} name={activeY1} fill="var(--neon-blue)" radius={[4, 4, 0, 0]} />
                        {activeY2 && <Bar dataKey={activeY2} name={activeY2} fill="var(--neon-cyan)" radius={[4, 4, 0, 0]} />}
                      </BarChart>
                    </ResponsiveContainer>
                    <p style={{ textAlign: 'center', fontSize: '12px', color: 'var(--text-muted)', margin: '10px 0 0 0' }}>*Mostrando los primeros 50 registros para optimización visual.</p>
                  </div>
                </div>
              </div>
            )}

            {/* VISTA 2: REPORTES (Tabla Cruda) */}
            {activeTab === 'reports' && data.length > 0 && (
              <div className="widget fade-in-up" style={{ padding: 0, overflow: 'hidden' }}>
                <div style={{ padding: '1.5rem', borderBottom: '1px solid var(--border-light)' }}>
                  <h3 style={{ margin: 0, fontSize: '18px', fontWeight: '500' }}>Base de Datos Analítica ({data.length} filas)</h3>
                </div>
                <div style={{ overflowX: 'auto', maxHeight: '70vh' }}>
                  <table style={{ width: '100%' }}>
                    <thead style={{ position: 'sticky', top: 0, background: 'var(--bg-widget)', backdropFilter: 'blur(10px)', zIndex: 10 }}>
                      <tr>
                        {columns.map(col => <th key={col}>{col}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {data.map((row, i) => (
                        <tr key={i}>
                          {columns.map(col => <td key={col}>{row[col]}</td>)}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VISTA 3: AJUSTES (Asignación de Variables) */}
            {activeTab === 'settings' && data.length > 0 && (
              <div className="widget fade-in-up" style={{ maxWidth: '600px' }}>
                <h3 style={{ margin: '0 0 1.5rem 0', fontSize: '18px', fontWeight: '500', display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <i className="ph ph-faders" style={{ color: 'var(--neon-orange)' }}></i> Configuración del Motor Analítico
                </h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '2rem' }}>Define manualmente qué variables de tu Excel utilizará el sistema para generar las gráficas y las métricas KPI.</p>
                
                <div style={{ marginBottom: '1.5rem' }}>
                  <label style={{ display: 'block', fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>Eje X (Categoría / Nombres)</label>
                  <select 
                    className="input-premium" 
                    value={userConfig.xAxis || activeX} 
                    onChange={e => setUserConfig({...userConfig, xAxis: e.target.value})}
                  >
                    {columns.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div style={{ marginBottom: '1.5rem' }}>
                  <label style={{ display: 'block', fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>Métrica Principal (Eje Y 1)</label>
                  <select 
                    className="input-premium" 
                    value={userConfig.yAxis1 || activeY1} 
                    onChange={e => setUserConfig({...userConfig, yAxis1: e.target.value})}
                  >
                    {columns.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div style={{ marginBottom: '2rem' }}>
                  <label style={{ display: 'block', fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>Métrica Secundaria (Opcional - Para comparar)</label>
                  <select 
                    className="input-premium" 
                    value={userConfig.yAxis2 || activeY2 || ''} 
                    onChange={e => setUserConfig({...userConfig, yAxis2: e.target.value})}
                  >
                    <option value="">-- Ninguna --</option>
                    {columns.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <button onClick={() => setActiveTab('dashboard')} className="file-upload-btn" style={{ animation: 'none', width: '100%', justifyContent: 'center' }}>Aplicar y Ver Tablero</button>
              </div>
            )}

            {/* ESTADO VACÍO */}
            {data.length === 0 && (
              <div className="widget fade-in-up" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
                <i className="ph ph-database" style={{ fontSize: '48px', color: 'var(--border-highlight)', marginBottom: '1rem' }}></i>
                <h3 style={{ margin: '0 0 10px 0', color: 'white' }}>Esperando Origen de Datos</h3>
                <p style={{ color: 'var(--text-muted)', margin: 0 }}>Importa un archivo arriba para activar el motor analítico.</p>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
