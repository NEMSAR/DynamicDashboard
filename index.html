<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEMS OS - Business Intelligence</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
  
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@1.8.5/umd/Recharts.min.js"></script>

  <style>
    /* VARIABLES ULTRA PREMIUM */
    :root {
      --bg-base: #030712; --bg-sidebar: #0b1121; --bg-widget: rgba(17, 24, 39, 0.7);
      --border-light: rgba(255, 255, 255, 0.08); --border-highlight: rgba(255, 255, 255, 0.2);
      --text-main: #f8fafc; --text-muted: #94a3b8;
      
      --brand-primary: #3b82f6; --brand-secondary: #8b5cf6; --brand-accent: #06b6d4;
      --alert-success: #10b981; --alert-warning: #f59e0b; --alert-danger: #ef4444;
      
      --shadow-soft: 0 10px 30px -10px rgba(0,0,0,0.5);
      --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.15);
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    [data-theme="light"] {
      --bg-base: #f8fafc; --bg-sidebar: #ffffff; --bg-widget: rgba(255, 255, 255, 0.9);
      --border-light: rgba(0, 0, 0, 0.06); --border-highlight: rgba(0, 0, 0, 0.15);
      --text-main: #0f172a; --text-muted: #64748b;
      --shadow-soft: 0 10px 30px -10px rgba(0,0,0,0.05);
      --shadow-glow: 0 0 30px rgba(59, 130, 246, 0.1);
    }

    /* GLOBAL */
    body { margin: 0; padding: 0; font-family: var(--font-main); background-color: var(--bg-base); color: var(--text-main); overflow-x: hidden; transition: background-color 0.5s ease; }
    body[data-theme="dark"]::before { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%); z-index: -1; pointer-events: none; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: 10px; }

    /* ANIMACIONES */
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes meshGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; }

    /* LOGIN SPLIT SCREEN */
    .login-wrapper { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--bg-base); }
    .login-art { flex: 1.2; position: relative; background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #082f49); background-size: 400% 400%; animation: meshGradient 15s ease infinite; display: flex; flex-direction: column; justify-content: space-between; padding: 4rem; color: white; border-right: 1px solid var(--border-light); }
    .login-art::after { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>'); opacity: 0.4; mix-blend-mode: overlay; pointer-events: none; }
    .login-form-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
    
    .glass-panel { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    
    /* INTERFAZ PRINCIPAL */
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 88px; background: var(--bg-sidebar); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; align-items: center; padding: 2rem 0; position: sticky; top: 0; height: 100vh; z-index: 50; transition: background 0.4s; box-shadow: 4px 0 24px rgba(0,0,0,0.02); }
    .nav-icon { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 24px; margin-bottom: 1rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .nav-icon::after { content: ''; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); width: 4px; height: 0; background: var(--brand-primary); border-radius: 0 4px 4px 0; transition: height 0.3s; }
    .nav-icon.active { color: var(--brand-primary); background: rgba(59, 130, 246, 0.1); }
    .nav-icon.active::after { height: 24px; }
    .nav-icon:hover:not(.active):not(.disabled) { color: var(--text-main); background: var(--border-light); transform: translateY(-2px); }
    .nav-icon.disabled { opacity: 0.3; cursor: not-allowed; }

    .main-content { flex: 1; padding: 2.5rem; max-width: 1800px; margin: 0 auto; width: calc(100% - 88px); box-sizing: border-box; }
    
    /* WIDGETS & BENTO GRID */
    .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
    .bento-2x { grid-column: span 2; }
    @media (max-width: 1200px) { .bento-2x { grid-column: span 1; } }

    .widget { background: var(--bg-widget); backdrop-filter: blur(24px); border: 1px solid var(--border-light); border-radius: 24px; padding: 1.75rem; transition: all 0.3s ease; box-shadow: var(--shadow-soft); position: relative; overflow: hidden; }
    .widget::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--border-highlight), transparent); opacity: 0; transition: opacity 0.3s; }
    .widget:hover { transform: translateY(-4px); box-shadow: var(--shadow-glow); border-color: var(--border-highlight); }
    .widget:hover::before { opacity: 1; }

    /* BOTONES & INPUTS */
    .btn-glow { position: relative; background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); border: none; color: white; padding: 14px 28px; border-radius: 14px; font-family: var(--font-main); font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; overflow: hidden; }
    .btn-glow::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
    .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px var(--brand-primary); }
    .btn-glow:hover::before { left: 100%; }

    .input-field { width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.15); border: 1px solid var(--border-light); border-radius: 12px; color: var(--text-main); font-family: var(--font-main); font-size: 15px; transition: all 0.3s; }
    [data-theme="light"] .input-field { background: rgba(255,255,255,0.5); }
    .input-field:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

    /* DROPZONE MAGNÉTICA */
    .dropzone { border: 2px dashed var(--border-light); border-radius: 20px; padding: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 15px; background: rgba(0,0,0,0.1); cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
    .dropzone:hover { border-color: var(--brand-primary); background: rgba(59, 130, 246, 0.05); }
    .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* TABLA DATA GRID */
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th { text-align: left; padding: 1.2rem 1rem; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border-highlight); cursor: pointer; transition: color 0.2s; position: sticky; top: 0; background: var(--bg-widget); backdrop-filter: blur(10px); z-index: 10; }
    th:hover { color: var(--brand-primary); }
    td { padding: 1.2rem 1rem; border-bottom: 1px solid var(--border-light); font-size: 14px; color: var(--text-main); transition: background 0.2s; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    [data-theme="light"] tr:hover td { background: rgba(0,0,0,0.02); }

    .loader { width: 24px; height: 24px; border: 3px solid var(--border-light); border-top-color: var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; }
  </style>
</head>
<body data-theme="dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;
    const { ComposedChart, Line, Bar, PieChart, Pie, Cell, Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;
    
    const CHART_COLORS = ['#3b82f6', '#06b6d4', '#8b5cf6', '#f97316', '#10b981', '#eab308'];

    function App() {
      const [authState, setAuthState] = useState({ loggedIn: false, loading: false });
      const [activeTab, setActiveTab] = useState('dashboard');
      const [data, setData] = useState([]);
      const [columns, setColumns] = useState([]);
      const [theme, setTheme] = useState('dark');
      const [isProcessing, setIsProcessing] = useState(false);
      
      const [searchTerm, setSearchTerm] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [userConfig, setUserConfig] = useState({ xAxis: '', yAxis1: '', yAxis2: '' });

      useEffect(() => { document.body.setAttribute('data-theme', theme); }, [theme]);

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthState({ ...authState, loading: true });
        // Simular conexión segura al servidor
        setTimeout(() => setAuthState({ loggedIn: true, loading: false }), 1500);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsProcessing(true);
        
        setTimeout(() => {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const buffer = new Uint8Array(event.target.result);
              const workbook = XLSX.read(buffer, { type: 'array' });
              const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
              if (sheetData.length > 0) {
                setData(sheetData);
                setColumns(Object.keys(sheetData[0]));
                setUserConfig({ xAxis: '', yAxis1: '', yAxis2: '' });
                setActiveTab('dashboard');
              }
            } catch (err) { alert("Error de integridad de archivo."); }
            finally { setIsProcessing(false); }
          };
          reader.readAsArrayBuffer(file);
        }, 800); // Fake delay for processing UX
      };

      // CORE MATEMÁTICO (Incluye Desviación Estándar y Radar)
      const analytics = useMemo(() => {
        if (!data.length || !columns.length) return null;
        
        const textCols = columns.filter(col => typeof data[0][col] === 'string' || isNaN(Number(data[0][col])));
        const numericCols = columns.filter(col => typeof data[0][col] === 'number' || !isNaN(Number(data[0][col]) && data[0][col] !== ""));

        const aX = userConfig.xAxis || (textCols.length > 0 ? textCols[0] : columns[0]);
        const aY1 = userConfig.yAxis1 || (numericCols.length > 0 ? numericCols[0] : columns[1] || columns[0]);
        const aY2 = userConfig.yAxis2 || '';

        let totalSum = 0; let maxVal = -Infinity; let topRecord = 'N/A';
        const groupedData = {};

        // Agrupación y Sumatoria
        data.forEach(row => {
          const key = row[aX] || 'N/A';
          const val1 = Number(row[aY1]) || 0;
          const val2 = aY2 ? (Number(row[aY2]) || 0) : 0;
          if (!groupedData[key]) groupedData[key] = { [aX]: key, [aY1]: 0, ...(aY2 && { [aY2]: 0 }) };
          groupedData[key][aY1] += val1;
          if (aY2) groupedData[key][aY2] += val2;
        });

        let processed = Object.values(groupedData).sort((a,b) => b[aY1] - a[aY1]).slice(0, 40);
        
        // Matemáticas Avanzadas
        let n = processed.length;
        let sumX=0, sumY=0, sumXY=0, sumX2=0;
        let varianceSum = 0;
        
        processed.forEach((item, idx) => {
          totalSum += item[aY1];
          if (item[aY1] > maxVal) { maxVal = item[aY1]; topRecord = item[aX]; }
          sumX += idx; sumY += item[aY1]; sumXY += (idx * item[aY1]); sumX2 += (idx * idx);
        });

        const avg = n > 0 ? totalSum / n : 0;
        processed.forEach(item => { varianceSum += Math.pow(item[aY1] - avg, 2); });
        const stdDev = n > 0 ? Math.sqrt(varianceSum / n) : 0; // Desviación Estándar

        const slope = n > 1 ? (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX) : 0;
        const intercept = n > 1 ? (sumY - slope * sumX) / n : 0;

        processed.forEach((item, idx) => {
          item.Tendencia = parseFloat((slope * idx + intercept).toFixed(2));
          // Fake forecasting para los últimos 3
          if(idx > n - 4) item.Forecast = parseFloat((slope * (idx+2) + intercept).toFixed(2)); 
        });

        const concentration = totalSum > 0 ? ((maxVal / totalSum) * 100).toFixed(1) : 0;
        const pieData = [...processed].slice(0, 6).map(item => ({ name: item[aX], value: item[aY1] }));
        
        // Datos para Radar Chart (Top 5 normalizados para visualización)
        const radarData = [...processed].slice(0, 5).map(item => ({
          subject: item[aX].toString().substring(0, 10),
          A: item[aY1],
          B: aY2 ? item[aY2] : item.Tendencia
        }));

        return { 
          aX, aY1, aY2,
          kpis: { 
            count: data.length, sum: totalSum, avg: avg.toFixed(2), stdDev: stdDev.toFixed(2),
            max: maxVal, topRecord, concentration, trendSlope: slope,
            chartData: processed, pieData, radarData
          } 
        };
      }, [data, columns, userConfig]);

      const sortedAndFilteredData = useMemo(() => {
        let sortable = [...data];
        if (searchTerm) sortable = sortable.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(searchTerm.toLowerCase())));
        if (sortConfig.key) {
          sortable.sort((a, b) => {
            const aVal = a[sortConfig.key]; const bVal = b[sortConfig.key];
            if (aVal === bVal) return 0;
            const aNum = Number(aVal); const bNum = Number(bVal);
            if (!isNaN(aNum) && !isNaN(bNum)) return sortConfig.direction === 'asc' ? aNum - bNum : bNum - aNum;
            return sortConfig.direction === 'asc' ? String(aVal).localeCompare(String(bVal)) : String(bVal).localeCompare(String(aVal));
          });
        }
        return sortable;
      }, [data, searchTerm, sortConfig]);

      // VISTA DE LOGIN (SPLIT SCREEN)
      if (!authState.loggedIn) {
        return (
          <div className="login-wrapper">
            <div className="login-art">
              <div>
                <div style={{ width: '60px', height: '60px', background: 'white', color: '#0f172a', borderRadius: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px', fontWeight: 'bold', marginBottom: '1.5rem' }}>N.</div>
                <h1 style={{ fontSize: '3.5rem', fontWeight: '700', margin: '0 0 1rem 0', lineHeight: '1.1' }}>Intelligence<br/>Amplified.</h1>
                <p style={{ fontSize: '1.1rem', color: 'rgba(255,255,255,0.7)', maxWidth: '400px' }}>NEMS OS transforma crudos operativos en decisiones estratégicas en milisegundos.</p>
              </div>
              <div>
                <p style={{ fontSize: '14px', color: 'rgba(255,255,255,0.5)' }}>© 2026 NEMS Tech Enterprise. Recreo, Catamarca.</p>
              </div>
            </div>
            
            <div className="login-form-container">
              <div style={{ width: '100%', maxWidth: '400px' }} className="animate-slide-up">
                <h2 style={{ fontSize: '28px', marginBottom: '8px' }}>Bienvenido al Sistema</h2>
                <p style={{ color: 'var(--text-muted)', marginBottom: '2.5rem' }}>Ingresa tus credenciales operativas.</p>
                
                <form onSubmit={handleLogin}>
                  <div style={{ marginBottom: '1.5rem' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: 'var(--text-muted)' }}>ID de Operador (Ej. JDE)</label>
                    <input type="text" className="input-field" defaultValue="emanuel.sosa" required />
                  </div>
                  <div style={{ marginBottom: '2rem' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: 'var(--text-muted)' }}>Clave de Acceso</label>
                    <input type="password" className="input-field" defaultValue="••••••••" required />
                  </div>
                  
                  <button type="submit" className="btn-glow" style={{ width: '100%', padding: '16px' }} disabled={authState.loading}>
                    {authState.loading ? <div className="loader"></div> : 'Autorizar Sesión Segura'}
                  </button>
                </form>
                
                <div style={{ display: 'flex', alignItems: 'center', gap: '15px', margin: '2rem 0' }}>
                  <div style={{ flex: 1, height: '1px', background: 'var(--border-light)' }}></div>
                  <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>O ingresa con</span>
                  <div style={{ flex: 1, height: '1px', background: 'var(--border-light)' }}></div>
                </div>
                
                <div style={{ display: 'flex', gap: '15px' }}>
                  <button className="btn-secondary" style={{ flex: 1, justifyContent: 'center' }}><i className="ph-fill ph-microsoft-logo" style={{ color: '#00a4ef', fontSize: '18px' }}></i> Azure AD</button>
                  <button className="btn-secondary" style={{ flex: 1, justifyContent: 'center' }}><i className="ph-fill ph-google-logo" style={{ color: '#ea4335', fontSize: '18px' }}></i> Workspace</button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // VISTA PRINCIPAL (DASHBOARD NEMS OS)
      return (
        <div className="app-container">
          <div className="sidebar animate-slide-up">
            <div style={{ color: 'var(--text-main)', fontSize: '26px', fontWeight: '800', marginBottom: '3rem' }}>N.</div>
            <div className={`nav-icon ${activeTab === 'dashboard' ? 'active' : ''} ${data.length === 0 ? 'disabled' : ''}`} onClick={() => data.length && setActiveTab('dashboard')} title="Workspace"><i className="ph-fill ph-squares-four"></i></div>
            <div className={`nav-icon ${activeTab === 'reports' ? 'active' : ''} ${data.length === 0 ? 'disabled' : ''}`} onClick={() => data.length && setActiveTab('reports')} title="Data Grid"><i className="ph-fill ph-table"></i></div>
            <div className={`nav-icon ${activeTab === 'settings' ? 'active' : ''} ${data.length === 0 ? 'disabled' : ''}`} onClick={() => data.length && setActiveTab('settings')} title="Motor Analítico"><i className="ph-fill ph-faders"></i></div>
            
            <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: '15px' }}>
              <div className="nav-icon" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title="Modo Visual">
                {theme === 'dark' ? <i className="ph-fill ph-sun"></i> : <i className="ph-fill ph-moon"></i>}
              </div>
              <div className="nav-icon" style={{ color: 'var(--alert-danger)' }} onClick={() => window.location.reload()} title="Desconectar"><i className="ph-fill ph-power"></i></div>
            </div>
          </div>

          <div className="main-content">
            
            {/* HEADER CON DROPZONE */}
            <div className="animate-slide-up" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '2.5rem' }}>
              <div>
                <h1 style={{ margin: '0 0 5px 0', fontSize: '32px', fontWeight: '700', letterSpacing: '-1px' }}>Centro de Mando Analítico</h1>
                <p style={{ color: 'var(--text-muted)', margin: 0, fontSize: '15px' }}>Arquitectura Zero-Cloud. Máximo rendimiento matemático local.</p>
              </div>
              
              <div className="dropzone" style={{ width: '350px' }}>
                {isProcessing ? (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '15px', color: 'var(--brand-primary)' }}><div className="loader"></div> Procesando tensores...</div>
                ) : (
                  <>
                    <i className="ph-fill ph-file-arrow-up" style={{ fontSize: '32px', color: 'var(--brand-primary)' }}></i>
                    <div>
                      <h4 style={{ margin: '0 0 3px 0', fontSize: '14px' }}>Arrastra tu matriz o haz clic</h4>
                      <p style={{ margin: 0, fontSize: '12px', color: 'var(--text-muted)' }}>.XLSX, .CSV (Soporta múltiples métricas)</p>
                    </div>
                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} />
                  </>
                )}
              </div>
            </div>

            {/* ESTADO VACÍO */}
            {data.length === 0 && !isProcessing && (
              <div className="animate-slide-up delay-1" style={{ height: '60vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', opacity: 0.7 }}>
                <i className="ph-duotone ph-cube-transparent" style={{ fontSize: '120px', color: 'var(--border-highlight)', marginBottom: '1rem', animation: 'float 6s ease-in-out infinite' }}></i>
                <h2 style={{ margin: '0 0 10px 0', fontWeight: '500' }}>Motor en Standby</h2>
                <p style={{ color: 'var(--text-muted)' }}>Carga un set de datos para inicializar los módulos de Machine Learning.</p>
              </div>
            )}

            {/* TAB: DASHBOARD */}
            {data.length > 0 && activeTab === 'dashboard' && analytics && (
              <div className="animate-slide-up delay-1">
                
                {/* IA INSIGHT */}
                <div className="widget" style={{ marginBottom: '1.5rem', display: 'flex', alignItems: 'center', gap: '20px', borderLeft: '4px solid var(--brand-primary)' }}>
                  <div style={{ width: '50px', height: '50px', borderRadius: '14px', background: 'rgba(59, 130, 246, 0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--brand-primary)', fontSize: '24px' }}>
                    <i className="ph-fill ph-brain"></i>
                  </div>
                  <div>
                    <h4 style={{ margin: '0 0 5px 0', display: 'flex', alignItems: 'center', gap: '10px' }}>
                      Síntesis Generada por Motor NEMS
                      {analytics.kpis.trendSlope > 0 ? <span style={{ color: 'var(--alert-success)', fontSize: '12px', background: 'rgba(16,185,129,0.1)', padding: '2px 8px', borderRadius: '10px' }}><i className="ph-bold ph-trend-up"></i> Expansión</span> : <span style={{ color: 'var(--alert-warning)', fontSize: '12px', background: 'rgba(245,158,11,0.1)', padding: '2px 8px', borderRadius: '10px' }}><i className="ph-bold ph-trend-down"></i> Contracción</span>}
                    </h4>
                    <p style={{ margin: 0, color: 'var(--text-muted)', fontSize: '14.5px', lineHeight: '1.6' }}>
                      Análisis completado sobre <strong>{analytics.kpis.count}</strong> registros. 
                      El activo dominante es <strong>{analytics.kpis.topRecord}</strong> abarcando el <strong>{analytics.kpis.concentration}%</strong> de la matriz. 
                      La desviación estándar indica una volatilidad de <strong>±{analytics.kpis.stdDev}</strong> respecto a la media.
                    </p>
                  </div>
                </div>

                {/* KPIs */}
                <div className="bento-grid">
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 5px 0', fontSize: '12px', fontWeight: '600', textTransform: 'uppercase' }}>Acumulado Bruto</p>
                    <h2 style={{ margin: 0, fontSize: '36px', fontWeight: '700' }}>{analytics.kpis.sum.toLocaleString()}</h2>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 5px 0', fontSize: '12px', fontWeight: '600', textTransform: 'uppercase' }}>Media Aritmética</p>
                    <h2 style={{ margin: 0, fontSize: '36px', fontWeight: '700', color: 'var(--brand-primary)' }}>{analytics.kpis.avg}</h2>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 5px 0', fontSize: '12px', fontWeight: '600', textTransform: 'uppercase' }}>Pico Histórico</p>
                    <h2 style={{ margin: 0, fontSize: '36px', fontWeight: '700', color: 'var(--brand-accent)' }}>{analytics.kpis.max.toLocaleString()}</h2>
                  </div>
                  <div className="widget">
                    <p style={{ color: 'var(--text-muted)', margin: '0 0 5px 0', fontSize: '12px', fontWeight: '600', textTransform: 'uppercase' }}>Volatilidad (Desv. Est.)</p>
                    <h2 style={{ margin: 0, fontSize: '36px', fontWeight: '700', color: 'var(--brand-secondary)' }}>±{analytics.kpis.stdDev}</h2>
                  </div>
                </div>

                {/* GRAFICOS AVANZADOS */}
                <div className="bento-grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
                  
                  {/* CHART PRINCIPAL (Ocupa 2 columnas) */}
                  <div className="widget bento-2x">
                    <h3 style={{ margin: '0 0 1.5rem 0', fontSize: '16px', fontWeight: '600' }}>Regresión y Forecasting (<span style={{color:'var(--brand-primary)'}}>{analytics.aY1}</span>)</h3>
                    <ResponsiveContainer width="100%" height={320}>
                      <ComposedChart data={analytics.kpis.chartData} margin={{ top: 5, right: 5, left: -20, bottom: 5 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="var(--border-light)" />
                        <XAxis dataKey={analytics.aX} tick={{fill: 'var(--text-muted)', fontSize: 11}} axisLine={false} tickLine={false} />
                        <YAxis tick={{fill: 'var(--text-muted)', fontSize: 11}} axisLine={false} tickLine={false} />
                        <Tooltip cursor={{fill: 'rgba(255,255,255,0.03)'}} contentStyle={{ backgroundColor: 'var(--bg-widget)', border: '1px solid var(--border-highlight)', borderRadius: '12px', color: 'var(--text-main)', backdropFilter: 'blur(10px)' }} />
                        <Bar dataKey={analytics.aY1} name="Volumen Real" fill="var(--brand-primary)" radius={[6, 6, 0, 0]} barSize={20} />
                        <Line type="monotone" dataKey="Tendencia" name="Tendencia Matemática" stroke="var(--alert-warning)" strokeWidth={3} dot={false} />
                        <Line type="step" dataKey="Forecast" name="Proyección Esperada" stroke="var(--brand-accent)" strokeWidth={2} strokeDasharray="5 5" dot={{r: 4}} />
                      </ComposedChart>
                    </ResponsiveContainer>
                  </div>

                  {/* RADAR CHART (Multidimensional) */}
                  <div className="widget">
                    <h3 style={{ margin: '0 0 1rem 0', fontSize: '16px', fontWeight: '600' }}>Rendimiento Top 5 (Radar)</h3>
                    <ResponsiveContainer width="100%" height={260}>
                      <RadarChart cx="50%" cy="50%" outerRadius="70%" data={analytics.kpis.radarData}>
                        <PolarGrid stroke="var(--border-light)" />
                        <PolarAngleAxis dataKey="subject" tick={{fill: 'var(--text-muted)', fontSize: 10}} />
                        <PolarRadiusAxis angle={30} domain={[0, 'auto']} tick={false} axisLine={false} />
                        <Radar name={analytics.aY1} dataKey="A" stroke="var(--brand-primary)" fill="var(--brand-primary)" fillOpacity={0.5} />
                        <Radar name="Variable B" dataKey="B" stroke="var(--brand-secondary)" fill="var(--brand-secondary)" fillOpacity={0.3} />
                        <Tooltip contentStyle={{ backgroundColor: 'var(--bg-widget)', border: 'none', borderRadius: '8px', color: 'var(--text-main)' }} />
                      </RadarChart>
                    </ResponsiveContainer>
                    <p style={{ textAlign: 'center', margin: 0, fontSize: '11px', color: 'var(--text-muted)' }}>Cruce dimensional de los 5 activos principales.</p>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: DATA GRID (Tabla con estilo premium) */}
            {activeTab === 'reports' && data.length > 0 && (
              <div className="widget animate-slide-up delay-1" style={{ padding: 0 }}>
                <div style={{ padding: '1.5rem 2rem', borderBottom: '1px solid var(--border-light)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h3 style={{ margin: '0 0 5px 0', fontSize: '18px', fontWeight: '600' }}>Data Grid Interactivo</h3>
                    <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-muted)' }}>Mostrando {sortedAndFilteredData.length} registros en memoria.</p>
                  </div>
                  <div style={{ display: 'flex', gap: '15px' }}>
                    <div style={{ position: 'relative' }}>
                      <i className="ph-bold ph-magnifying-glass" style={{ position: 'absolute', left: '15px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}></i>
                      <input type="text" placeholder="Filtrar matriz..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="input-field" style={{ paddingLeft: '40px', width: '300px', borderRadius: '20px' }} />
                    </div>
                  </div>
                </div>
                
                <div style={{ overflowX: 'auto', maxHeight: '60vh' }}>
                  <table>
                    <thead>
                      <tr>{columns.map(col => <th key={col} onClick={() => requestSort(col)}>{col} {sortConfig.key === col ? (sortConfig.direction === 'asc' ? '↑' : '↓') : ''}</th>)}</tr>
                    </thead>
                    <tbody>
                      {sortedAndFilteredData.length > 0 ? sortedAndFilteredData.slice(0, 500).map((row, i) => (
                        <tr key={i}>{columns.map(col => <td key={col}>{row[col]}</td>)}</tr>
                      )) : <tr><td colSpan={columns.length} style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-muted)' }}>Cero coincidencias en el vector de búsqueda.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: SETTINGS */}
            {activeTab === 'settings' && data.length > 0 && (
              <div className="widget animate-slide-up delay-1" style={{ maxWidth: '600px' }}>
                <h3 style={{ margin: '0 0 5px 0', fontSize: '20px', fontWeight: '600' }}>Calibración del Modelo Numérico</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', margin: '0 0 2rem 0' }}>Fuerza el comportamiento de los ejes cartesianos y radiales.</p>
                
                <div style={{ background: 'rgba(0,0,0,0.1)', padding: '1.5rem', borderRadius: '16px', border: '1px solid var(--border-light)' }}>
                  <div style={{ marginBottom: '1.5rem' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: 'var(--text-muted)' }}>Eje de Agrupación (Dimensión Principal)</label>
                    <select className="input-field" value={userConfig.xAxis || analytics?.aX} onChange={e => setUserConfig({...userConfig, xAxis: e.target.value})}>{columns.map(c => <option key={c} value={c}>{c}</option>)}</select>
                  </div>
                  <div style={{ marginBottom: '1.5rem' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: 'var(--text-muted)' }}>Vector de Rendimiento 1 (Volumen/Monto)</label>
                    <select className="input-field" value={userConfig.yAxis1 || analytics?.aY1} onChange={e => setUserConfig({...userConfig, yAxis1: e.target.value})}>{columns.map(c => <option key={c} value={c}>{c}</option>)}</select>
                  </div>
                  <div style={{ marginBottom: '2.5rem' }}>
                    <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: 'var(--text-muted)' }}>Vector de Rendimiento 2 (Para Radar/Comparativa)</label>
                    <select className="input-field" value={userConfig.yAxis2 || analytics?.aY2 || ''} onChange={e => setUserConfig({...userConfig, yAxis2: e.target.value})}><option value="">-- Modo Singular (Sin 2da Variable) --</option>{columns.map(c => <option key={c} value={c}>{c}</option>)}</select>
                  </div>
                  
                  <button onClick={() => setActiveTab('dashboard')} className="btn-glow" style={{ width: '100%' }}>
                    <i className="ph-bold ph-cpu"></i> Recalcular Red Neuronal Local
                  </button>
                </div>
              </div>
            )}
            
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
